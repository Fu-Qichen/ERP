server:
  port: 8080

spring:
  application:
    name: erp-demo
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/erp_demo
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
